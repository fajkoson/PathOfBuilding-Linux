name: Run Tests
on:
  push:
    branches: [ linux-support ]
  pull_request:
    branches: [ linux-support ]
  workflow_dispatch:
jobs:
  run_tests:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: busted --lua=luajit
  check_modcache:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Install git dependency
        run: apk add git
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate ModCache
        env:
          LUA_PATH: ../resources/lua/?.lua;../resources/lua/?/init.lua
          REGENERATE_MOD_CACHE: 1
        run: cd source/lua; luajit HeadlessWrapper.lua
      - run: git config --global --add safe.directory $(pwd)
      - name: Check if the generated ModCache is different
        run: git diff --exit-code source/lua/Data/ModCache.lua
